<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HumanTrust AI</title>
    <style>
      body {
        width: 230px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        padding: 12px;
        margin: 0;
        background-color: #ffffff;
        color: #202124;
      }
      h3 {
        margin: 0 0 10px 0;
        font-size: 15px;
        font-weight: 600;
        color: #1a73e8;
      }
      .btn-container {
        display: flex;
        gap: 8px;
        margin-bottom: 12px;
      }
      button {
        flex: 1;
        padding: 8px 10px;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.15s ease-in-out;
      }
      #start {
        background-color: #1a73e8;
        color: #ffffff;
      }
      #start:hover {
        background-color: #1557b0;
      }
      #stop {
        background-color: #f1f3f4;
        color: #3c4043;
        border: 1px solid #dadce0;
      }
      #stop:hover {
        background-color: #e8eaed;
      }
      #status {
        margin: 0;
        font-size: 12px;
        color: #5f6368;
        line-height: 1.4;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <h3>HumanTrust AI</h3>
    <div class="btn-container">
      <button id="start">Start verification</button>
      <button id="stop">Stop</button>
    </div>
    <p id="status">Status: Idle</p>
    <script src="popup.js"></script>
  </body>
</html>
